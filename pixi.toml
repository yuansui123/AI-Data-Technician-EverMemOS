[workspace]
authors = ["Yuan Sui <105005921+yuansui123@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "AI_Data_Technician"
platforms = ["win-64"]
version = "0.1.0"

[activation]
env = { PYTHONNOUSERSITE = "1" }

[tasks]
start = "python main.py"
web = "python main.py"
webdebug = "python main.py --debug"

[dependencies]
python = "3.11.*"
numpy = ">=2.4.2,<3"
scipy = ">=1.17.1,<2"
pandas = ">=3.0.1,<4"
scikit-learn = ">=1.8.0,<2"
mne = ">=1.11.0,<2"
antropy = ">=0.2.1,<0.3"
ruptures = ">=1.1.10,<2"
h5py = ">=3.0,<4"           # MATLAB v7.3 / HDF5 file support
matplotlib = ">=3.0,<4"     # signal plotting (also pulled by mne)

[pypi-dependencies]
mat73 = ">=0.65"             # simple API for MATLAB v7.3 MAT files
anthropic = ">=0.84.0, <0.85"
httpx = "*"
tiktoken = ">=0.12.0, <0.13"
pymupdf = ">=1.27.2, <2"
typing-extensions = ">=4.12"
google-genai = ">=1.67.0, <2"
python-dotenv = ">=1.2.2, <2"
fastapi = { version = ">=0.135.1, <0.136", extras = ["standard"] }
uvicorn = ">=0.41.0, <0.42"
